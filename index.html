    function Nav({current,lang,setLang,t,isFullscreen,toggleFullscreen,fullscreenSupported}){return <nav className="nav"><div className="brand">{t.brand}</div><div className="nav-right"><div className="nav-links">{pageKeys.map(k=><a key={k} href={`#/${k}?lang=${lang}`} className={`nav-link ${current===k?'active':''}`}>{t.nav[k]}</a>)}</div><button className={`fullscreen-btn ${isFullscreen?'active':''}`} onClick={toggleFullscreen} disabled={!fullscreenSupported} title={isFullscreen?t.fullscreenExit:t.fullscreenEnter}>{isFullscreen?t.fullscreenExit:t.fullscreenEnter}</button><div className="lang-switch" aria-label={t.langLabel}><button className={`lang-btn ${lang==='en'?'active':''}`} onClick={()=>setLang('en')}>EN</button><button className={`lang-btn ${lang==='ru'?'active':''}`} onClick={()=>setLang('ru')}>RU</button><button className={`lang-btn ${lang==='he'?'active':''}`} onClick={()=>setLang('he')}>HE</button></div></div></nav>}
    function LandingPromo({lang,t}){return <section className="section"><p className="section-title">{t.landingPromoTitle}</p><div className="grid-2"><article className="panel"><h3>{serviceContent.landing[lang][0]}</h3><p>{t.landingPromoLead}</p><div className="panel-price">{t.landingFrom}</div><div className="panel-price">{t.landingMid}</div><p style={{marginTop:'12px'}}>{t.landingNote}</p><div className="panel-note"><strong>{t.landingTimingTitle}</strong><ul>{t.landingTiming.map((item,i)=><li key={i}>{item}</li>)}</ul></div><div className="panel-note"><strong>{t.landingExtraTitle}</strong><ul>{t.landingExtras.map((item,i)=><li key={i}>{item}</li>)}</ul></div><div className="panel-cta"><a className="btn btn-primary" href={`#/order?lang=${lang}&service=landing`}>{t.primaryCta}</a></div></article><article className="panel"><h3>{t.landingIncludesTitle}</h3><ul>{t.landingIncludes.map((item,i)=><li key={i}>{item}</li>)}</ul></article></div></section>}
    function UrgencySection({t}){return <section className="section"><p className="section-title">{t.urgencyTitle}</p><h2>{t.urgencyHead}</h2><div className="grid section">{t.urgencyItems.map(([title,text],i)=><article className="panel" key={i}><h3>{title}</h3><p>{text}</p></article>)}</div></section>}
    function ProblemsSection({t}){return <section className="section"><p className="section-title">{t.problemsTitle}</p><h2>{t.problemsHead}</h2><div className="grid section">{t.problems.map(([title,text],i)=><article className="panel" key={i}><h3>{title}</h3><p>{text}</p></article>)}</div></section>}
    function CasesSection({t}){return <section className="section"><p className="section-title">{t.casesTitle}</p><h2>{t.casesHead}</h2><div className="grid section">{t.cases.map(([title,text],i)=><article className="panel" key={i}><h3>{title}</h3><p>{text}</p></article>)}</div></section>}
    function ProcessSection({t}){return <section className="section"><p className="section-title">{t.processTitle}</p><h2>{t.processHead}</h2><div className="grid section">{t.process.map(([title,text],i)=><article className="panel" key={i}><h3>{title}</h3><p>{text}</p></article>)}</div></section>}
    function HomePage({lang,t}){return <><div className="badge">{t.badge}</div><h1>{t.heroTitle}</h1><p className="lead">{t.heroLead}</p><div className="actions"><a className="btn btn-primary" href={`#/order?lang=${lang}`}>{t.primaryCta}</a><a className="btn btn-secondary" href={`#/order?lang=${lang}&service=landing`}>{serviceContent.landing[lang][0]}</a></div><div className="stats">{t.stats.map(([a,b],i)=><div className="stat" key={i}><strong>{a}</strong><span>{b}</span></div>)}</div><UrgencySection t={t} /><LandingPromo lang={lang} t={t} /><ProblemsSection t={t} /><CasesSection t={t} /><ProcessSection t={t} /><section className="section"><p className="section-title">{t.sectionMain}</p><div className="grid">{serviceKeys.slice(0,3).map(key=><article className="panel" key={key}><h3>{serviceContent[key][lang][0]}</h3><p>{serviceContent[key][lang][1]}</p><div className="panel-cta"><a className="btn btn-secondary" href={`#/order?lang=${lang}&service=${key}`}>{t.primaryCta}</a></div></article>)}</div></section></>}
    function ServicesPage({lang,t}){return <><p className="section-title">{t.servicesTitle}</p><h2>{t.servicesHead}</h2><p className="muted">{t.servicesLead}</p><UrgencySection t={t} /><LandingPromo lang={lang} t={t} /><div className="grid section">{serviceKeys.map(key=><article className="panel" key={key}><h3>{serviceContent[key][lang][0]}</h3><p>{serviceContent[key][lang][1]}</p>{key==='landing'?<div className="panel-price">{t.landingFrom}</div>:null}<div className="panel-cta"><a className="btn btn-secondary" href={`#/order?lang=${lang}&service=${key}`}>{t.primaryCta}</a></div></article>)}</div></>}
    function AboutPage({t}){return <><p className="section-title">{t.aboutTitle}</p><h2>{t.aboutHead}</h2><div className="grid-2 section">{t.aboutCards.map(([title,text],i)=><article className="panel" key={i}><h3>{title}</h3><p>{text}</p></article>)}</div><section className="section"><p className="section-title">{t.stack}</p><div className="panel"><div className="tech-list">{technologies.map(tech=><span className="tech" key={tech}>{tech}</span>)}</div></div></section></>}
    function LeadForm({lang,t,initialService=''}){const [form,setForm]=React.useState({name:'',contact:'',service:initialService,budget:'',message:'',company:'',website:'',projectType:'',urgency:'',deadline:''});const [loading,setLoading]=React.useState(false);const [status,setStatus]=React.useState({type:'',text:''});React.useEffect(()=>{setForm(prev=>({...prev,service:initialService||prev.service}))},[initialService]);const onChange=e=>setForm({...form,[e.target.name]:e.target.value});async function onSubmit(e){e.preventDefault();setStatus({type:'',text:''});if(form.website.trim()){setStatus({type:'err',text:t.form.errors.denied});return}if(!form.contact.trim()||!form.message.trim()){setStatus({type:'err',text:t.form.errors.basic});return}setLoading(true);try{await fetch(GOOGLE_SCRIPT_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:form.name.trim(),contact:form.contact.trim(),company:form.company.trim(),service:form.service?serviceContent[form.service][lang][0]:'',budget:form.budget.trim(),project_type:form.projectType.trim(),urgency:form.urgency.trim(),deadline:form.deadline.trim(),message:form.message.trim(),source:window.location.href,origin:window.location.origin,sent_at:new Date().toISOString(),hp_field:form.website.trim()})});setStatus({type:'ok',text:t.form.ok});setForm({name:'',contact:'',service:initialService,budget:'',message:'',company:'',website:'',projectType:'',urgency:'',deadline:''})}catch(err){setStatus({type:'err',text:t.form.errors.fail})}finally{setLoading(false)}}return <form className="form" onSubmit={onSubmit}><div className="field"><label htmlFor="service">{t.form.service}</label><select className="select" id="service" name="service" value={form.service} onChange={onChange}><option value="">{t.form.choose}</option>{serviceKeys.map(key=><option value={key} key={key}>{serviceContent[key][lang][0]}</option>)}</select></div><div className="field"><label htmlFor="projectType">{t.form.projectType}</label><select className="select" id="projectType" name="projectType" value={form.projectType} onChange={onChange}><option value="">{t.form.projectTypeChoose}</option>{t.form.projectTypes.map((item,i)=><option value={item} key={i}>{item}</option>)}</select></div><div className="field"><label htmlFor="name">{t.form.name}</label><input className="input" id="name" name="name" value={form.name} onChange={onChange} placeholder={t.form.namePh} /></div><div className="field"><label htmlFor="company">{t.form.company}</label><input className="input" id="company" name="company" value={form.company} onChange={onChange} placeholder={t.form.companyPh} /></div><div className="field"><label htmlFor="contact">{t.form.contact}</label><input className="input" id="contact" name="contact" value={form.contact} onChange={onChange} placeholder={t.form.contactPh} required /></div><div className="field"><label htmlFor="budget">{t.form.budget}</label><input className="input" id="budget" name="budget" value={form.budget} onChange={onChange} placeholder={t.form.budgetPh} /></div><div className="field"><label htmlFor="urgency">{t.form.urgency}</label><select className="select" id="urgency" name="urgency" value={form.urgency} onChange={onChange}><option value="">{t.form.urgencyChoose}</option>{t.form.urgencyOptions.map((item,i)=><option value={item} key={i}>{item}</option>)}</select></div><div className="field"><label htmlFor="deadline">{t.form.deadline}</label><input className="input" id="deadline" name="deadline" value={form.deadline} onChange={onChange} placeholder={t.form.deadlinePh} /></div><div className="field"><label htmlFor="message">{t.form.message}</label><textarea className="textarea" id="message" name="message" value={form.message} onChange={onChange} placeholder={t.form.messagePh} required /></div><div className="field hidden" aria-hidden="true"><label htmlFor="website">Website</label><input tabIndex="-1" autoComplete="off" className="input" id="website" name="website" value={form.website} onChange={onChange} /></div>{status.text?<div className={`status ${status.type==='ok'?'ok':'err'}`}>{status.text}</div>:null}<div className="actions"><button className="btn btn-primary" type="submit" disabled={loading}>{loading?t.form.sending:t.form.send}</button></div></form>}
    function OrderPage({lang,t}){const initialService=getServiceFromHash();return <><p className="section-title">{t.orderTitle}</p><h2>{t.orderHead}</h2><p className="muted">{t.orderLead}</p><UrgencySection t={t} /><LandingPromo lang={lang} t={t} /><div className="grid-2 section"><article className="panel"><h3>{t.orderListTitle}</h3><ul>{serviceKeys.map(key=><li key={key}>{serviceContent[key][lang][0]}</li>)}</ul><div className="panel-cta"><span>{t.orderListHint}</span></div></article><article className="panel"><h3>{t.formTitle}</h3><LeadForm lang={lang} t={t} initialService={initialService} /></article></div></>}
    function ContactPage({lang,t}){return <><p className="section-title">{t.contactTitle}</p><h2>{t.contactHead}</h2><p className="muted">{t.contactLead}</p><div className="grid-2 section"><article className="panel"><div className="contact-list">{t.contactCards.map(([a,b],i)=><div className="contact-item" key={i}><strong>{a}</strong><span>{b}</span></div>)}</div><div className="actions"><a className="btn btn-primary" href={`#/order?lang=${lang}`}>{t.goOrder}</a></div></article><article className="panel"><h3>{t.quickReq}</h3><LeadForm lang={lang} t={t} /></article></div></>}
    function Footer({t}){return <footer className="footer"><span>© 2026. {t.footer}</span><span>Full-stack Developer</span></footer>}
    function App(){const [lang,setLangState]=React.useState(getInitialLang());const [current,setCurrent]=React.useState(getPageFromHash());const [isFullscreen,setIsFullscreen]=React.useState(!!document.fullscreenElement);const fullscreenSupported=typeof document.documentElement.requestFullscreen==='function';React.useEffect(()=>{const onHashChange=()=>{setCurrent(getPageFromHash());setLangState(getInitialLang())};const onFullscreenChange=()=>setIsFullscreen(!!document.fullscreenElement);window.addEventListener('hashchange',onHashChange);document.addEventListener('fullscreenchange',onFullscreenChange);if(!window.location.hash)setHash('home',lang);return ()=>{window.removeEventListener('hashchange',onHashChange);document.removeEventListener('fullscreenchange',onFullscreenChange)}},[]);async function toggleFullscreen(){if(!fullscreenSupported)return;try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}catch(e){console.error('Fullscreen toggle failed',e)}}function setLang(next){setLangState(next);setHash(current,next,current==='order'?getServiceFromHash():'')}const t=dictionary[lang];const isRtl=lang==='he';let pageContent=<HomePage lang={lang} t={t} />;if(current==='services')pageContent=<ServicesPage lang={lang} t={t} />;else if(current==='about')pageContent=<AboutPage t={t} />;else if(current==='contact')pageContent=<ContactPage lang={lang} t={t} />;else if(current==='order')pageContent=<OrderPage lang={lang} t={t} />;React.useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=isRtl?'rtl':'ltr';updateSeo(current,lang)},[lang,isRtl,current]);return <div className={`page ${isRtl?'rtl':''}`}><main className="shell"><Nav current={current} lang={lang} setLang={setLang} t={t} isFullscreen={isFullscreen} toggleFullscreen={toggleFullscreen} fullscreenSupported={fullscreenSupported} /><section className="content">{pageContent}</section><Footer t={t} /></main></div>}
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
