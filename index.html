<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vizitka</title>
  <meta name="description" content="Персональная визитка Максима Марковича" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Inter,Arial,sans-serif;
      color:#e5e7eb;
      background:
        radial-gradient(circle at top right, rgba(56,189,248,.18), transparent 28%),
        radial-gradient(circle at bottom left, rgba(99,102,241,.16), transparent 30%),
        linear-gradient(135deg,#0f172a,#1e293b);
      min-height:100vh;
    }
    a{color:inherit}
    .page{max-width:1120px;margin:0 auto;padding:28px}
    .shell{
      background:rgba(15,23,42,.78);
      border:1px solid rgba(255,255,255,.1);
      border-radius:28px;
      box-shadow:0 24px 80px rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
      overflow:hidden;
    }
    .nav{
      display:flex;justify-content:space-between;align-items:center;gap:16px;
      padding:18px 28px;border-bottom:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02)
    }
    .brand{font-weight:800;font-size:18px;letter-spacing:.02em}
    .nav-links{display:flex;gap:10px;flex-wrap:wrap}
    .nav-link{
      text-decoration:none;padding:10px 14px;border-radius:12px;
      color:#cbd5e1;border:1px solid transparent;transition:.18s ease
    }
    .nav-link:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06)}
    .nav-link.active{background:rgba(56,189,248,.1);color:#7dd3fc;border-color:rgba(56,189,248,.22)}
    .content{padding:42px 40px 28px}
    .badge{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 14px;border-radius:999px;
      border:1px solid rgba(56,189,248,.3);
      background:rgba(56,189,248,.08);
      color:#7dd3fc;font-size:14px;margin-bottom:18px
    }
    h1{margin:0;font-size:clamp(34px,7vw,64px);line-height:1.02;max-width:780px}
    h2{margin:0 0 14px;font-size:28px}
    .lead{margin:18px 0 0;max-width:820px;font-size:20px;line-height:1.7;color:#cbd5e1}
    .muted{color:#cbd5e1;line-height:1.8;font-size:18px}
    .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:14px 20px;border-radius:14px;text-decoration:none;
      font-weight:700;transition:.18s ease
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:#38bdf8;color:#082f49}
    .btn-secondary{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#e5e7eb}
    .section{margin-top:34px}
    .section-title{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7dd3fc;margin:0 0 16px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .panel{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:22px
    }
    .panel h3{margin:0 0 10px;font-size:20px}
    .panel p,.panel li{margin:0;color:#cbd5e1;line-height:1.7}
    .panel ul{margin:0;padding-left:18px}
    .tech-list{display:flex;flex-wrap:wrap;gap:10px}
    .tech{
      padding:10px 14px;border-radius:999px;
      background:rgba(56,189,248,.08);
      border:1px solid rgba(56,189,248,.16);
      color:#dbeafe;font-size:14px
    }
    .contact-list{display:grid;gap:14px}
    .contact-item{padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
    .contact-item strong{display:block;margin-bottom:6px;font-size:15px;color:#7dd3fc}
    .footer{
      margin-top:10px;padding:24px 40px 32px;
      border-top:1px solid rgba(255,255,255,.08);
      display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
      color:#94a3b8;font-size:14px
    }
    .footer a{text-decoration:none;color:#7dd3fc}
    .footer a:hover{text-decoration:underline}
    @media (max-width: 860px){
      .grid,.grid-2{grid-template-columns:1fr}
      .content,.footer{padding-left:24px;padding-right:24px}
      .nav{padding:16px 20px;align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const services = [
      {
        title: 'Веб-разработка',
        text: 'Создаю и поддерживаю сайты, интернет-магазины, админ-панели и кастомные веб-системы под задачи бизнеса.'
      },
      {
        title: 'Интеграции и автоматизация',
        text: 'Подключаю API, CRM, ERP-подобные процессы, платёжные сервисы, документы и автоматизацию рабочих сценариев.'
      },
      {
        title: 'Поддержка и инфраструктура',
        text: 'Работаю с backend, frontend, серверами, базами данных, деплоем, сопровождением проектов и технической диагностикой.'
      }
    ];

    const technologies = [
      'PHP', 'Laravel', 'WordPress', 'WooCommerce', 'JavaScript', 'Vue', 'React', 'MySQL', 'Directus', 'Linux', 'AWS', 'API'
    ];

    const pages = [
      { key: 'home', label: 'Главная' },
      { key: 'services', label: 'Услуги' },
      { key: 'about', label: 'Обо мне' },
      { key: 'contact', label: 'Контакты' }
    ];

    function getPageFromHash() {
      const key = window.location.hash.replace('#/', '') || 'home';
      return pages.some(p => p.key === key) ? key : 'home';
    }

    function Badge() {
      return <div className="badge">● Full-stack Developer</div>;
    }

    function Nav({ current }) {
      return (
        <nav className="nav">
          <div className="brand">Maxim Markovich</div>
          <div className="nav-links">
            {pages.map((page) => (
              <a
                key={page.key}
                href={`#/${page.key}`}
                className={`nav-link ${current === page.key ? 'active' : ''}`}
              >
                {page.label}
              </a>
            ))}
          </div>
        </nav>
      );
    }

    function HomePage() {
      return (
        <>
          <Badge />
          <h1>Привет, я Максим</h1>
          <p className="lead">
            Я full-stack разработчик. Создаю и поддерживаю сайты, интернет-магазины, админ-панели, CRM/ERP-подобные системы, API-интеграции и автоматизацию бизнес-процессов.
            Работаю с кастомной разработкой под реальные задачи бизнеса: от frontend и backend до серверов, баз данных и сопровождения проектов.
          </p>
          <div className="actions">
            <a className="btn btn-primary" href="#/contact">Связаться</a>
            <a className="btn btn-secondary" href="https://github.com/maxfullstackcom" target="_blank" rel="noreferrer">GitHub</a>
          </div>

          <section className="section">
            <p className="section-title">Основные направления</p>
            <div className="grid">
              {services.map((item) => (
                <article className="panel" key={item.title}>
                  <h3>{item.title}</h3>
                  <p>{item.text}</p>
                </article>
              ))}
            </div>
          </section>
        </>
      );
    }

    function ServicesPage() {
      return (
        <>
          <p className="section-title">Услуги</p>
          <h2>Чем я могу помочь</h2>
          <p className="muted">
            Беру в работу как новые проекты, так и поддержку существующих систем. Делаю не только интерфейсы, но и всю техническую часть вокруг продукта.
          </p>
          <div className="grid section">
            <article className="panel">
              <h3>Сайты и магазины</h3>
              <p>Корпоративные сайты, лендинги, интернет-магазины, каталоги, кастомные личные кабинеты и админ-панели.</p>
            </article>
            <article className="panel">
              <h3>Бизнес-системы</h3>
              <p>CRM/ERP-подобные решения, внутренние панели управления, автоматизация рутины и рабочих процессов.</p>
            </article>
            <article className="panel">
              <h3>Интеграции</h3>
              <p>Платежи, документы, API сторонних сервисов, обмен данными между системами и кастомные коннекторы.</p>
            </article>
            <article className="panel">
              <h3>Поддержка</h3>
              <p>Исправление багов, улучшение производительности, техническая диагностика, сопровождение и развитие проекта.</p>
            </article>
            <article className="panel">
              <h3>Серверная часть</h3>
              <p>Backend-логика, базы данных, доступы, деплой, хостинг, Linux-среда и поддержка инфраструктуры.</p>
            </article>
            <article className="panel">
              <h3>Кастомная разработка</h3>
              <p>Когда готового решения недостаточно — проектирую и собираю систему под конкретные задачи бизнеса.</p>
            </article>
          </div>
        </>
      );
    }

    function AboutPage() {
      return (
        <>
          <p className="section-title">Обо мне</p>
          <h2>Разработка под реальные задачи</h2>
          <div className="grid-2 section">
            <article className="panel">
              <h3>Подход</h3>
              <p>Мне ближе практичная разработка: понять задачу бизнеса, убрать лишнее, собрать устойчивое решение и довести его до рабочего состояния.</p>
            </article>
            <article className="panel">
              <h3>Что важно</h3>
              <p>Надёжность, понятная логика, поддерживаемый код, аккуратная интеграция с текущими системами и возможность спокойно развивать проект дальше.</p>
            </article>
          </div>
          <section className="section">
            <p className="section-title">Стек и инструменты</p>
            <div className="panel">
              <div className="tech-list">
                {technologies.map((tech) => (
                  <span className="tech" key={tech}>{tech}</span>
                ))}
              </div>
            </div>
          </section>
        </>
      );
    }

    function ContactPage() {
      return (
        <>
          <p className="section-title">Контакты</p>
          <h2>Связаться со мной</h2>
          <p className="muted">
            Можно написать по проекту, поддержке существующей системы, интеграции, автоматизации или оценке задачи.
          </p>
          <div className="grid-2 section">
            <article className="panel">
              <div className="contact-list">
                <div className="contact-item">
                  <strong>Email</strong>
                  <a href="mailto:your@email.com">your@email.com</a>
                </div>
                <div className="contact-item">
                  <strong>GitHub</strong>
                  <a href="https://github.com/maxfullstackcom" target="_blank" rel="noreferrer">github.com/maxfullstackcom</a>
                </div>
                <div className="contact-item">
                  <strong>Формат работы</strong>
                  <span>Разработка, сопровождение, доработка и техническая поддержка проектов</span>
                </div>
              </div>
            </article>
            <article className="panel">
              <h3>С чем можно обращаться</h3>
              <ul>
                <li>новый сайт или система с нуля</li>
                <li>доработка существующего проекта</li>
                <li>интеграция между сервисами</li>
                <li>исправление сложных багов</li>
                <li>админка, база данных, backend или frontend</li>
                <li>техническая оценка и помощь с архитектурой</li>
              </ul>
              <div className="actions">
                <a className="btn btn-primary" href="mailto:your@email.com">Написать на email</a>
              </div>
            </article>
          </div>
        </>
      );
    }

    function Footer() {
      return (
        <footer className="footer">
          <span>© 2026 Максим Маркович. Сделано с вниманием к деталям.</span>
          <a href="https://github.com/maxfullstackcom" target="_blank" rel="noreferrer">maxfullstackcom</a>
        </footer>
      );
    }

    function App() {
      const [current, setCurrent] = React.useState(getPageFromHash());

      React.useEffect(() => {
        const onHashChange = () => setCurrent(getPageFromHash());
        window.addEventListener('hashchange', onHashChange);
        if (!window.location.hash) window.location.hash = '#/home';
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      let pageContent;
      if (current === 'services') pageContent = <ServicesPage />;
      else if (current === 'about') pageContent = <AboutPage />;
      else if (current === 'contact') pageContent = <ContactPage />;
      else pageContent = <HomePage />;

      return (
        <div className="page">
          <main className="shell">
            <Nav current={current} />
            <section className="content">{pageContent}</section>
            <Footer />
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
